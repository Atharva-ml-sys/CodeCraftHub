<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
      :root {
        --primary: #8B5CF6;
        --primary-dark: #7C3AED;
        --primary-light: #A78BFA;
        --success: #F59E0B;
        --success-dark: #D97706;
        --danger: #EF4444;
        --danger-dark: #DC2626;
        --bg: #F8FAFC;
        --surface: #FFFFFF;
        --text: #1E293B;
        --muted: #64748B;
        --border: #E2E8F0;
        --border-strong: #CBD5E1;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.12), 0 4px 6px rgba(15, 23, 42, 0.08);
        --radius: 10px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* Header */
      .app-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        padding: 2.5rem 1.5rem;
        text-align: center;
        box-shadow: var(--shadow-lg);
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.9rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .app-header p {
        margin: 0.5rem 0 0;
        font-size: 0.95rem;
        opacity: 0.9;
      }

      /* Layout */
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .panel-title {
        margin: 0 0 1.25rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .panel-title::before {
        content: "";
        display: inline-block;
        width: 4px;
        height: 1.1em;
        background: var(--primary);
        border-radius: 2px;
      }

      /* Form */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem 1.25rem;
      }
      .field { display: flex; flex-direction: column; gap: 0.35rem; }
      .field.full { grid-column: 1 / -1; }
      .field label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--muted);
      }
      .field label .req { color: var(--danger); margin-left: 2px; }

      input, textarea, select {
        font-family: inherit;
        font-size: 0.95rem;
        color: var(--text);
        background: #fff;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        padding: 0.6rem 0.7rem;
        transition: border-color 0.15s, box-shadow 0.15s;
        width: 100%;
      }
      textarea { resize: vertical; min-height: 80px; }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
      }
      .field-error {
        border-color: var(--danger) !important;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12) !important;
      }
      .field-msg {
        font-size: 0.78rem;
        color: var(--danger);
        min-height: 1em;
      }

      /* Buttons */
      .btn {
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 0.6rem 1.1rem;
        cursor: pointer;
        transition: background-color 0.15s, transform 0.05s, box-shadow 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
      .btn-success { background: var(--success); color: #fff; }
      .btn-success:hover:not(:disabled) { background: var(--success-dark); }
      .btn-danger { background: var(--danger); color: #fff; }
      .btn-danger:hover:not(:disabled) { background: var(--danger-dark); }
      .btn-ghost {
        background: #fff;
        color: var(--primary);
        border-color: var(--border-strong);
      }
      .btn-ghost:hover:not(:disabled) { background: #F5F3FF; border-color: var(--primary-light); }
      .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.83rem; }

      .form-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.25rem;
        flex-wrap: wrap;
      }

      /* Status badges */
      .badge {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge-not-started { background: #F1F5F9; color: #475569; }
      .badge-in-progress { background: #FEF3C7; color: var(--success-dark); }
      .badge-completed { background: #DCFCE7; color: #15803D; }

      /* Table */
      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        min-width: 720px;
      }
      thead th {
        text-align: left;
        padding: 0.75rem 0.9rem;
        background: #F8FAFC;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid var(--border);
      }
      tbody td {
        padding: 0.9rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover { background: #FAFAFE; }
      .course-name { font-weight: 600; color: var(--text); }
      .course-desc {
        color: var(--muted);
        font-size: 0.85rem;
        max-width: 320px;
        white-space: pre-wrap;
      }
      .course-meta { font-size: 0.83rem; color: var(--muted); }
      .row-actions { display: flex; gap: 0.5rem; white-space: nowrap; }

      /* Empty + loading states */
      .state-box {
        text-align: center;
        padding: 2.5rem 1rem;
        color: var(--muted);
      }
      .state-box .big { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5; }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.45);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .spinner-dark {
        border-color: rgba(15, 23, 42, 0.2);
        border-top-color: var(--primary);
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Inline loading banner */
      .loading-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.75rem;
        background: #F5F3FF;
        color: var(--primary-dark);
        border-radius: 8px;
        font-size: 0.88rem;
        font-weight: 500;
        margin-bottom: 1rem;
      }

      /* Toast / banner messages */
      .toast-stack {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        max-width: 360px;
      }
      .toast {
        padding: 0.85rem 1rem;
        border-radius: 8px;
        color: #fff;
        font-size: 0.88rem;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: toast-in 0.2s ease;
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .toast-success { background: #16A34A; }
      .toast-error { background: var(--danger); }
      .toast-info { background: var(--primary); }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 900;
      }
      .modal-overlay.open { display: flex; }
      .modal {
        background: var(--surface);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
        animation: modal-in 0.18s ease;
      }
      @keyframes modal-in {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .modal-head {
        padding: 1.1rem 1.4rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-head h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
      .modal-close {
        background: none; border: none; cursor: pointer;
        font-size: 1.4rem; line-height: 1; color: var(--muted);
        padding: 0.2rem 0.4rem; border-radius: 6px;
      }
      .modal-close:hover { background: #F1F5F9; color: var(--text); }
      .modal-body { padding: 1.4rem; }
      .modal-body .form-grid { grid-template-columns: 1fr; }
      .modal-foot {
        padding: 1rem 1.4rem;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
      }

      /* Footer note */
      .api-note {
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.5rem;
      }

      @media (max-width: 640px) {
        .app-header { padding: 1.75rem 1rem; }
        .app-header h1 { font-size: 1.4rem; }
        .form-grid { grid-template-columns: 1fr; }
        .container { padding: 1.25rem 0.9rem 2rem; }
        .panel { padding: 1.1rem; }
        .toast-stack { left: 0.75rem; right: 0.75rem; max-width: none; }
      }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <header class="app-header">
      <h1>CodeCraftHub: Your Learning Management Platform</h1>
      <p>Plan, track, and master the skills you set out to learn.</p>
    </header>

    <main class="container">
      <!-- Add Course Form -->
      <section class="panel" id="addPanel">
        <h2 class="panel-title">Add a New Course</h2>
        <form id="courseForm" novalidate>
          <div class="form-grid">
            <div class="field full">
              <label for="name">Course Name<span class="req">*</span></label>
              <input type="text" id="name" name="name" placeholder="e.g. Introduction to TypeScript" autocomplete="off" />
              <span class="field-msg" data-for="name"></span>
            </div>
            <div class="field full">
              <label for="description">Description<span class="req">*</span></label>
              <textarea id="description" name="description" placeholder="What will this course cover?"></textarea>
              <span class="field-msg" data-for="description"></span>
            </div>
            <div class="field">
              <label for="target_date">Target Date<span class="req">*</span></label>
              <input type="date" id="target_date" name="target_date" />
              <span class="field-msg" data-for="target_date"></span>
            </div>
            <div class="field">
              <label for="status">Status<span class="req">*</span></label>
              <select id="status" name="status">
                <option value="" disabled selected>Select a status</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
              <span class="field-msg" data-for="status"></span>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Add Course</button>
            <button type="reset" class="btn btn-ghost">Clear</button>
          </div>
        </form>
      </section>

      <!-- Course List -->
      <section class="panel">
        <h2 class="panel-title">Your Courses</h2>
        <div id="loadingBar" class="loading-bar" style="display:none;">
          <span class="spinner spinner-dark"></span>
          <span id="loadingText">Loading courses…</span>
        </div>
        <div id="courseState"></div>
        <div class="table-wrap" id="tableWrap" style="display:none;">
          <table>
            <thead>
              <tr>
                <th>Course</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="courseBody"></tbody>
          </table>
        </div>
      </section>

      <p class="api-note">
        Connected to backend at <code id="apiUrlLabel"></code>. If a request fails,
        the error will be shown above.
      </p>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal">
        <div class="modal-head">
          <h2 id="editModalTitle">Edit Course</h2>
          <button type="button" class="modal-close" id="editClose" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <form id="editForm" novalidate>
            <input type="hidden" id="edit_id" />
            <div class="form-grid">
              <div class="field full">
                <label for="edit_name">Course Name<span class="req">*</span></label>
                <input type="text" id="edit_name" />
                <span class="field-msg" data-for="edit_name"></span>
              </div>
              <div class="field full">
                <label for="edit_description">Description<span class="req">*</span></label>
                <textarea id="edit_description"></textarea>
                <span class="field-msg" data-for="edit_description"></span>
              </div>
              <div class="field">
                <label for="edit_target_date">Target Date<span class="req">*</span></label>
                <input type="date" id="edit_target_date" />
                <span class="field-msg" data-for="edit_target_date"></span>
              </div>
              <div class="field">
                <label for="edit_status">Status<span class="req">*</span></label>
                <select id="edit_status">
                  <option value="" disabled>Select a status</option>
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
                <span class="field-msg" data-for="edit_status"></span>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="editCancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="editSave">Save Changes</button>
        </div>
      </div>
    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script>
      // ---- Configuration ----------------------------------------------------
      // Change this single constant to point the dashboard at a different backend.
      const API_BASE_URL = "https://cluster-marble-surrounding-con.trycloudflare.com/api/courses";
      const VALID_STATUSES = ["Not Started", "In Progress", "Completed"];

      // ---- DOM refs ---------------------------------------------------------
      const form = document.getElementById("courseForm");
      const submitBtn = document.getElementById("submitBtn");
      const courseState = document.getElementById("courseState");
      const tableWrap = document.getElementById("tableWrap");
      const courseBody = document.getElementById("courseBody");
      const loadingBar = document.getElementById("loadingBar");
      const loadingText = document.getElementById("loadingText");
      const editModal = document.getElementById("editModal");
      const editForm = document.getElementById("editForm");
      const editSave = document.getElementById("editSave");
      const toastStack = document.getElementById("toastStack");

      document.getElementById("apiUrlLabel").textContent = API_BASE_URL;

      // ---- Toasts -----------------------------------------------------------
      function toast(message, type = "info", duration = 3800) {
        const el = document.createElement("div");
        el.className = `toast toast-${type}`;
        el.textContent = message;
        toastStack.appendChild(el);
        setTimeout(() => {
          el.style.transition = "opacity 0.25s, transform 0.25s";
          el.style.opacity = "0";
          el.style.transform = "translateY(-8px)";
          setTimeout(() => el.remove(), 260);
        }, duration);
      }

      // ---- Loading helpers --------------------------------------------------
      function setLoading(message) {
        loadingText.textContent = message;
        loadingBar.style.display = "flex";
      }
      function clearLoading() {
        loadingBar.style.display = "none";
      }

      // ---- Date formatting --------------------------------------------------
      function formatDate(value) {
        if (!value) return "—";
        const d = new Date(value);
        if (isNaN(d.getTime())) return value; // fallback to raw string
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      // ---- API wrapper ------------------------------------------------------
      // Handles non-2xx responses, invalid JSON, and network errors uniformly.
      async function apiRequest(path, options = {}) {
        const url = path ? `${API_BASE_URL}/${path}` : API_BASE_URL;
        let response;
        try {
          response = await fetch(url, {
            headers: { "Content-Type": "application/json", ...(options.headers || {}) },
            ...options,
          });
        } catch (err) {
          // Network failure / CORS / server unreachable.
          throw new Error(
            `Could not reach the backend at ${API_BASE_URL}. Make sure the Spring Boot server is running and CORS is enabled.`
          );
        }

        // 204 No Content (typical for DELETE)
        if (response.status === 204) return null;

        let payload = null;
        const text = await response.text();
        if (text) {
          try {
            payload = JSON.parse(text);
          } catch {
            payload = text; // non-JSON body
          }
        }

        if (!response.ok) {
          const detail =
            (payload && typeof payload === "object" &&
              (payload.message || payload.error || payload.errors)) ||
            (typeof payload === "string" && payload) ||
            `Request failed with status ${response.status}`;
          throw new Error(detail);
        }
        return payload;
      }

      // ---- Validation -------------------------------------------------------
      function validateCourse(data, fieldPrefix) {
        const errors = {};
        if (!data.name || !data.name.trim()) errors.name = "Course name is required.";
        if (!data.description || !data.description.trim()) errors.description = "Description is required.";
        if (!data.target_date) errors.target_date = "Target date is required.";
        if (!data.status) errors.status = "Status is required.";
        else if (!VALID_STATUSES.includes(data.status)) errors.status = "Status must be one of: " + VALID_STATUSES.join(", ");
        return errors;
      }

      function showFieldErrors(errors, idMap) {
        Object.entries(idMap).forEach(([field, inputId]) => {
          const input = document.getElementById(inputId);
          const msg = document.querySelector(`.field-msg[data-for="${inputId}"]`);
          if (errors[field]) {
            input.classList.add("field-error");
            if (msg) msg.textContent = errors[field];
          } else {
            input.classList.remove("field-error");
            if (msg) msg.textContent = "";
          }
        });
      }

      function clearFieldErrors(idMap) {
        Object.values(idMap).forEach((inputId) => {
          document.getElementById(inputId).classList.remove("field-error");
          const msg = document.querySelector(`.field-msg[data-for="${inputId}"]`);
          if (msg) msg.textContent = "";
        });
      }

      // The backend wraps every response in an envelope like
      // { success, courses:[] } or { success, course:{} }. Unwrap it so the
      // rest of the UI can work with plain arrays/objects.
      function unwrapList(payload) {
        if (Array.isArray(payload)) return payload;
        if (payload && Array.isArray(payload.courses)) return payload.courses;
        if (payload && payload.course) return [payload.course];
        return [];
      }
      function unwrapCourse(payload) {
        if (!payload) return null;
        if (payload.course) return payload.course;
        if (payload.id !== undefined) return payload;
        return null;
      }

      // ---- Render -----------------------------------------------------------
      function statusBadgeClass(status) {
        if (status === "In Progress") return "badge-in-progress";
        if (status === "Completed") return "badge-completed";
        return "badge-not-started";
      }

      function escapeHtml(str) {
        return String(str ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function renderCourses(courses) {
        if (!Array.isArray(courses)) courses = [];
        if (courses.length === 0) {
          tableWrap.style.display = "none";
          courseState.innerHTML = `
            <div class="state-box">
              <div class="big">&#128218;</div>
              <p>No courses yet. Add your first course using the form above.</p>
            </div>`;
          return;
        }
        courseState.innerHTML = "";
        tableWrap.style.display = "block";
        courseBody.innerHTML = courses.map((c) => `
          <tr data-id="${escapeHtml(c.id)}">
            <td>
              <div class="course-name">${escapeHtml(c.name)}</div>
              <div class="course-desc">${escapeHtml(c.description)}</div>
            </td>
            <td><span class="course-meta">${escapeHtml(formatDate(c.target_date))}</span></td>
            <td><span class="badge ${statusBadgeClass(c.status)}">${escapeHtml(c.status)}</span></td>
            <td><span class="course-meta">${escapeHtml(formatDate(c.created_at))}</span></td>
            <td>
              <div class="row-actions">
                <button class="btn btn-ghost btn-sm" data-action="edit" data-id="${escapeHtml(c.id)}">Edit</button>
                <button class="btn btn-danger btn-sm" data-action="delete" data-id="${escapeHtml(c.id)}">Remove</button>
              </div>
            </td>
          </tr>
        `).join("");
      }

      function renderError(message) {
        tableWrap.style.display = "none";
        courseState.innerHTML = `
          <div class="state-box">
            <div class="big" style="color:var(--danger)">&#9888;</div>
            <p>${escapeHtml(message)}</p>
            <button class="btn btn-primary btn-sm" style="margin-top:1rem" id="retryBtn">Try Again</button>
          </div>`;
        const retryBtn = document.getElementById("retryBtn");
        if (retryBtn) retryBtn.addEventListener("click", loadCourses);
      }

      // ---- CRUD -------------------------------------------------------------
      async function loadCourses() {
        setLoading("Loading courses…");
        courseState.innerHTML = "";
        try {
          const data = await apiRequest("", { method: "GET" });
          renderCourses(unwrapList(data));
        } catch (err) {
          renderError(err.message);
          toast(err.message, "error", 5000);
        } finally {
          clearLoading();
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const idMap = { name: "name", description: "description", target_date: "target_date", status: "status" };
        const data = {
          name: form.name.value,
          description: form.description.value,
          target_date: form.target_date.value,
          status: form.status.value,
        };
        const errors = validateCourse(data);
        showFieldErrors(errors, idMap);
        if (Object.keys(errors).length > 0) {
          toast("Please fix the highlighted fields.", "error");
          return;
        }

        submitBtn.disabled = true;
        const originalLabel = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner"></span> Adding…';
        try {
          await apiRequest("", {
            method: "POST",
            body: JSON.stringify(data),
          });
          toast("Course added successfully.", "success");
          form.reset();
          clearFieldErrors(idMap);
          await loadCourses();
        } catch (err) {
          toast("Failed to add course: " + err.message, "error", 5000);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalLabel;
        }
      });

      form.addEventListener("reset", () => {
        clearFieldErrors({ name: "name", description: "description", target_date: "target_date", status: "status" });
      });

      // ---- Row actions (edit / delete) -------------------------------------
      courseBody.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const id = btn.dataset.id;
        if (btn.dataset.action === "delete") {
          handleDelete(id, btn);
        } else if (btn.dataset.action === "edit") {
          openEditModal(id);
        }
      });

      async function handleDelete(id, btn) {
        if (!confirm("Are you sure you want to remove this course? This cannot be undone.")) return;
        btn.disabled = true;
        const original = btn.innerHTML;
        btn.innerHTML = '<span class="spinner"></span>';
        setLoading("Removing course…");
        try {
          await apiRequest(encodeURIComponent(id), { method: "DELETE" });
          toast("Course removed.", "success");
          await loadCourses();
        } catch (err) {
          toast("Failed to remove course: " + err.message, "error", 5000);
          btn.disabled = false;
          btn.innerHTML = original;
        } finally {
          clearLoading();
        }
      }

      // ---- Edit modal -------------------------------------------------------
      const editIdMap = { name: "edit_name", description: "edit_description", target_date: "edit_target_date", status: "edit_status" };

      function openModal() { editModal.classList.add("open"); }
      function closeModal() {
        editModal.classList.remove("open");
        clearFieldErrors(editIdMap);
      }

      async function openEditModal(id) {
        setLoading("Fetching course details…");
        try {
          const course = unwrapCourse(await apiRequest(encodeURIComponent(id), { method: "GET" }));
          if (!course || course.id === undefined) throw new Error("Course not found.");
          document.getElementById("edit_id").value = course.id;
          document.getElementById("edit_name").value = course.name || "";
          document.getElementById("edit_description").value = course.description || "";
          document.getElementById("edit_target_date").value = course.target_date || "";
          document.getElementById("edit_status").value = course.status || "";
          clearFieldErrors(editIdMap);
          openModal();
        } catch (err) {
          toast("Failed to load course: " + err.message, "error", 5000);
        } finally {
          clearLoading();
        }
      }

      editSave.addEventListener("click", async () => {
        const id = document.getElementById("edit_id").value;
        if (!id) return;
        const data = {
          name: document.getElementById("edit_name").value,
          description: document.getElementById("edit_description").value,
          target_date: document.getElementById("edit_target_date").value,
          status: document.getElementById("edit_status").value,
        };
        const errors = validateCourse(data);
        showFieldErrors(errors, editIdMap);
        if (Object.keys(errors).length > 0) {
          toast("Please fix the highlighted fields.", "error");
          return;
        }

        editSave.disabled = true;
        const original = editSave.innerHTML;
        editSave.innerHTML = '<span class="spinner"></span> Saving…';
        try {
          await apiRequest(encodeURIComponent(id), {
            method: "PUT",
            body: JSON.stringify(data),
          });
          toast("Course updated successfully.", "success");
          closeModal();
          editSave.disabled = false;
          editSave.innerHTML = original;
          await loadCourses();
        } catch (err) {
          toast("Failed to update course: " + err.message, "error", 5000);
          editSave.disabled = false;
          editSave.innerHTML = original;
        }
      });

      document.getElementById("editClose").addEventListener("click", closeModal);
      document.getElementById("editCancel").addEventListener("click", closeModal);
      editModal.addEventListener("click", (e) => { if (e.target === editModal) closeModal(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && editModal.classList.contains("open")) closeModal(); });

      // ---- Initial load -----------------------------------------------------
      loadCourses();
    </script>
  </body>
</html>
